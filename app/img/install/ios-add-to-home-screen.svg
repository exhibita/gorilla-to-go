<svg xmlns='http://www.w3.org/2000/svg' width='360' height='510' viewBox='0 0 360 510' role='img' aria-label='iPhone: Add to Home Screen, Open as Web App on, then Add' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>iPhone: Add to Home Screen, Open as Web App on, then Add</title>
