<text x='20' y='32' font-size='16' font-weight='bold' fill='#2b2b2b' text-anchor='start' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>iPhone: Add to Home Screen</text><text x='20' y='56' font-size='12' font-weight='normal' fill='#6b6b6b' text-anchor='start' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>In the Share list, scroll down. Tap this row:</text><rect x='20' y='68' width='320' height='200' rx='12' fill='#ffffff' stroke='#d9d4cb'/><text x='36' y='93' font-size='14' font-weight='normal' fill='#2b2b2b' text-anchor='start' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Copy</text><line x1='34' x2='326' y1='108' y2='108' stroke='#d9d4cb'/><text x='36' y='133' font-size='14' font-weight='normal' fill='#2b2b2b' text-anchor='start' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Add to Reading List</text><line x1='34' x2='326' y1='148' y2='148' stroke='#d9d4cb'/><text x='36' y='173' font-size='14' font-weight='normal' fill='#2b2b2b' text-anchor='start' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Add Bookmark</text><line x1='34' x2='326' y1='188' y2='188' stroke='#d9d4cb'/><text x='36' y='213' font-size='14' font-weight='bold' fill='#2b2b2b' text-anchor='start' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Add to Home Screen</text><line x1='34' x2='326' y1='228' y2='228' stroke='#d9d4cb'/><text x='36' y='253' font-size='14' font-weight='normal' fill='#2b2b2b' text-anchor='start' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Find on Page</text><rect x='17' y='190' width='326' height='36' rx='10' fill='none' stroke='#c2410c' stroke-width='3'/><circle cx='326' cy='208' r='12' fill='#c2410c'/><text x='326' y='213' font-size='13' font-weight='bold' fill='#fff' text-anchor='middle' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>2</text><text x='20' y='296' font-size='12' font-weight='normal' fill='#6b6b6b' text-anchor='start' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>On the next screen:</text><rect x='20' y='306' width='320' height='150' rx='12' fill='#ffffff' stroke='#d9d4cb'/><text x='40' y='336' font-size='14' font-weight='normal' fill='#2f6fdf' text-anchor='start' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Cancel</text><text x='180' y='336' font-size='14' font-weight='bold' fill='#2b2b2b' text-anchor='middle' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Add to Home Screen</text><text x='318' y='336' font-size='14' font-weight='bold' fill='#2f6fdf' text-anchor='end' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Add</text><rect x='292' y='318' width='36' height='26' rx='8' fill='none' stroke='#c2410c' stroke-width='3'/><circle cx='318' cy='302' r='12' fill='#c2410c'/><text x='318' y='307' font-size='13' font-weight='bold' fill='#fff' text-anchor='middle' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>4</text><rect x='36' y='352' width='40' height='40' rx='9' fill='#55704f'/><text x='56' y='378' font-size='12' font-weight='bold' fill='#fff' text-anchor='middle' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>GTG</text><text x='90' y='378' font-size='15' font-weight='normal' fill='#2b2b2b' text-anchor='start' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>GTG</text><line x1='36' x2='324' y1='404' y2='404' stroke='#d9d4cb'/><text x='36' y='434' font-size='14' font-weight='normal' fill='#2b2b2b' text-anchor='start' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Open as Web App</text><rect x='268' y='418' width='50' height='28' rx='14' fill='#34c759'/><circle cx='304' cy='432' r='11' fill='#fff'/><rect x='260' y='412' width='66' height='40' rx='20' fill='none' stroke='#c2410c' stroke-width='3'/><circle cx='250' cy='432' r='12' fill='#c2410c'/><text x='250' y='437' font-size='13' font-weight='bold' fill='#fff' text-anchor='middle' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>3</text><text x='20' y='480' font-size='12' font-weight='normal' fill='#2b2b2b' text-anchor='start' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>3 = keep "Open as Web App" ON.   4 = tap Add.</text>
<text x='348' y='500' text-anchor='end' font-size='10' fill='#6b6b6b' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Drawing. Your screen can look different.</text>
