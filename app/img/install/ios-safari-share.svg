<svg xmlns='http://www.w3.org/2000/svg' width='360' height='360' viewBox='0 0 360 360' role='img' aria-label='iPhone Safari: where the Share button is' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>iPhone Safari: where the Share button is</title>
<rect width='360' height='360' rx='18' fill='#f8f6f2' stroke='#d9d4cb'/>
<text x='20' y='32' font-size='16' font-weight='bold' fill='#2b2b2b' text-anchor='start' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>iPhone Safari: find Share</text><text x='20' y='56' font-size='12' font-weight='normal' fill='#6b6b6b' text-anchor='start' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Layout A (newer iPhones): tap the ••• button.</text><rect x='20' y='68' width='320' height='54' rx='27' fill='#ffffff' stroke='#d9d4cb'/><path d='M44 95 l8 -8 M44 95 l8 8' stroke='#2b2b2b' stroke-width='2.4' fill='none' stroke-linecap='round'/><rect x='72' y='80' width='200' height='30' rx='15' fill='#efece6'/><text x='172' y='100' font-size='13' font-weight='normal' fill='#2b2b2b' text-anchor='middle' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>gorillatogo.app</text><circle cx='298' cy='95' r='2.6' fill='#2b2b2b'/><circle cx='306' cy='95' r='2.6' fill='#2b2b2b'/><circle cx='314' cy='95' r='2.6' fill='#2b2b2b'/><rect x='284' y='76' width='44' height='38' rx='19' fill='none' stroke='#c2410c' stroke-width='3'/><circle cx='306' cy='136' r='12' fill='#c2410c'/><text x='306' y='141' font-size='13' font-weight='bold' fill='#fff' text-anchor='middle' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>1</text><text x='20' y='176' font-size='12' font-weight='normal' fill='#6b6b6b' text-anchor='start' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Then tap Share in the menu that opens.</text><text x='20' y='214' font-size='12' font-weight='normal' fill='#6b6b6b' text-anchor='start' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Layout B (bottom or top bar): tap the Share icon.</text><rect x='20' y='226' width='320' height='54' rx='12' fill='#ffffff' stroke='#d9d4cb'/><rect x='51' y='244' width='18' height='20' rx='4' fill='none' stroke='#6b6b6b' stroke-width='2'/><rect x='111' y='244' width='18' height='20' rx='4' fill='none' stroke='#6b6b6b' stroke-width='2'/><g fill='none' stroke='#2b2b2b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M172 252 h-3 v15 h22 v-15 h-3'/><path d='M180 260 V243'/><path d='M175 248 L180 243 L185 248'/></g><rect x='231' y='244' width='18' height='20' rx='4' fill='none' stroke='#6b6b6b' stroke-width='2'/><rect x='291' y='244' width='18' height='20' rx='4' fill='none' stroke='#6b6b6b' stroke-width='2'/><rect x='158' y='231' width='44' height='44' rx='10' fill='none' stroke='#c2410c' stroke-width='3'/><circle cx='180' cy='296' r='12' fill='#c2410c'/><text x='180' y='301' font-size='13' font-weight='bold' fill='#fff' text-anchor='middle' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>1</text><text x='20' y='330' font-size='12' font-weight='normal' fill='#2b2b2b' text-anchor='start' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>The Share icon is a box with an up arrow.</text>
<text x='348' y='350' text-anchor='end' font-size='10' fill='#6b6b6b' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Drawing. Your screen can look different.</text>
