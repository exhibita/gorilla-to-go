<title>iPhone Chrome, Edge and Firefox: where to find Share</title>
<rect width='360' height='318' rx='18' fill='#f8f6f2' stroke='#d9d4cb'/>
<text x='20' y='32' font-size='16' font-weight='bold' fill='#2b2b2b' text-anchor='start' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>iPhone Chrome, Edge, Firefox: find Share</text><rect x='20' y='54' width='320' height='54' rx='12' fill='#ffffff' stroke='#d9d4cb'/><text x='34' y='78' font-size='14' font-weight='bold' fill='#2b2b2b' text-anchor='start' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Chrome</text><text x='34' y='96' font-size='12' font-weight='normal' fill='#6b6b6b' text-anchor='start' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Share icon in the address bar</text><g fill='none' stroke='#2b2b2b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M298 78 h-3 v15 h22 v-15 h-3'/><path d='M306 86 V69'/><path d='M301 74 L306 69 L311 74'/></g><rect x='284' y='59' width='44' height='44' rx='10' fill='none' stroke='#c2410c' stroke-width='3'/><rect x='20' y='120' width='320' height='54' rx='12' fill='#ffffff' stroke='#d9d4cb'/><text x='34' y='144' font-size='14' font-weight='bold' fill='#2b2b2b' text-anchor='start' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Edge</text><text x='34' y='162' font-size='12' font-weight='normal' fill='#6b6b6b' text-anchor='start' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>••• menu, then Share</text><circle cx='298' cy='147' r='2.6' fill='#2b2b2b'/><circle cx='306' cy='147' r='2.6' fill='#2b2b2b'/><circle cx='314' cy='147' r='2.6' fill='#2b2b2b'/><rect x='284' y='125' width='44' height='44' rx='10' fill='none' stroke='#c2410c' stroke-width='3'/><rect x='20' y='186' width='320' height='54' rx='12' fill='#ffffff' stroke='#d9d4cb'/><text x='34' y='210' font-size='14' font-weight='bold' fill='#2b2b2b' text-anchor='start' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Firefox</text><text x='34' y='228' font-size='12' font-weight='no