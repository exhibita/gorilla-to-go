<svg xmlns='http://www.w3.org/2000/svg' width='360' height='400' viewBox='0 0 360 400' role='img' aria-label='Android Chrome: three-dot menu and the install rows' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Android Chrome: three-dot menu and the install rows</title>
<rect width='360' height='400' rx='18' fill='#f8f6f2' stroke='#d9d4cb'/>
<text x='20' y='32' font-size='16' font-weight='bold' fill='#2b2b2b' text-anchor='start' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Android Chrome: open the menu</text><rect x='20' y='46' width='320' height='50' rx='12' fill='#ffffff' stroke='#d9d4cb'/><rect x='34' y='58' width='240' height='26' rx='13' fill='#efece6'/><text x='154' y='76' font-size='13' font-weight='normal' fill='#2b2b2b' text-anchor='middle' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>gorillatogo.app</text><circle cx='310' cy='63' r='2.6' fill='#2b2b2b'/><circle cx='310' cy='71' r='2.6' fill='#2b2b2b'/><circle cx='310' cy='79' r='2.6' fill='#2b2b2b'/><rect x='292' y='51' width='36' height='40' rx='10' fill='none' stroke='#c2410c' stroke-width='3'/><circle cx='310' cy='112' r='12' fill='#c2410c'/><text x='310' y='117' font-size='13' font-weight='bold' fill='#fff' text-anchor='middle' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>1</text><text x='20' y='148' font-size='12' font-weight='normal' fill='#6b6b6b' text-anchor='start' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Find ONE of these rows (the name depends</text><text x='20' y='164' font-size='12' font-weight='normal' fill='#6b6b6b' text-anchor='start' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>on your Chrome version):</text><rect x='20' y='176' width='320' height='200' rx='12' fill='#ffffff' stroke='#d9d4cb'/><text x='36' y='201' font-size='14' font-weight='normal' fill='#2b2b2b' text-anchor='start' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>New tab</text><line x1='34' x2='326' y1='216' y2='216' stroke='#d9d4cb'/><text x='36' y='241' font-size='14' font-weight='normal' fill='#2b2b2b' text-anchor='start' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Bookmarks</text><line x1='34' x2='326' y1='256' y2='256' stroke='#d9d4cb'/><text x='36' y='281' font-size='14' font-weight='bold' fill='#2b2b2b' text-anchor='start' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Install app</text><line x1='34' x2='326' y1='296' y2='296' stroke='#d9d4cb'/><text x='36' y='321' font-size='14' font-weight='normal' fill='#2b2b2b' text-anchor='start' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Add to Home screen</text><line x1='34' x2='326' y1='336' y2='336' stroke='#d9d4cb'/><text x='36' y='361' font-size='14' font-weight='normal' fill='#2b2b2b' text-anchor='start' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Install and create shortcut</text><rect x='17' y='258' width='326' height='36' rx='10' fill='none' stroke='#c2410c' stroke-width='3'/><rect x='17' y='298' width='326' height='36' rx='10' fill='none' stroke='#c2410c' stroke-width='3'/><rect x='17' y='338' width='326' height='36' rx='10' fill='none' stroke='#c2410c' stroke-width='3'/><circle cx='326' cy='278' r='12' fill='#c2410c'/><text x='326' y='283' font-size='13' font-weight='bold' fill='#fff' text-anchor='middle' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>2</text>
<text x='348' y='390' text-anchor='end' font-size='10' fill='#6b6b6b' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Drawing. Your screen can look different.</text>
